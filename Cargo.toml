[package]
name = "runq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A bounded local command queue with sampled memory supervision"
license = "MIT"
repository = "https://github.com/figtracer/runq"
readme = "README.md"

[dependencies]
libc = "0.2.190"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
